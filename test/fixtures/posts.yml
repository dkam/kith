alice_followers:
  actor: alice
  title: The long way round
  audience: followers
  published_at: <%= 3.hours.ago.to_fs(:db) %>

alice_public:
  actor: alice
  title: On keeping a notebook
  audience: public
  published_at: <%= 2.hours.ago.to_fs(:db) %>

bob_followers:
  actor: bob
  audience: followers
  published_at: <%= 1.hour.ago.to_fs(:db) %>

carol_followers:
  actor: carol
  title: Quietly
  audience: followers
  published_at: <%= 30.minutes.ago.to_fs(:db) %>

dave_followers:
  actor: dave
  title: Nobody follows Dave
  audience: followers
  published_at: <%= 10.minutes.ago.to_fs(:db) %>

# Drafts have no published_at at all: publication is the act, and the timestamp
# is its only record. Nobody but the author may see one, whatever its audience
# says — alice_public_draft is the one that would leak if a draft were treated
# as a post that simply hasn't been fanned out yet.
alice_draft:
  actor: alice
  title: Not finished yet
  audience: followers

alice_public_draft:
  actor: alice
  title: Half a thought
  audience: public

carol_draft:
  actor: carol
  title: Carol's own business
  audience: followers
