name: Build and publish image

# Publishes the multi-arch image (amd64 + arm64) to GitHub Packages
# (ghcr.io/dkam/kith) whenever config/version.rb changes on main — a version
# bump IS the release. Each arch builds natively (no QEMU); a merge job stitches
# them into one manifest tagged both :vX.Y.Z and :X.Y.Z (+ :latest for
# non-pre-releases), and a final job creates the matching git tag and GitHub
# Release.
#
# To cut a release: edit Kith::VERSION in config/version.rb, commit, push.
# For a dev build: set a pre-release version (e.g. "0.2.0-dev") — it publishes
# its own tags, does not move :latest, and creates no git tag. Or run this
# workflow manually from the Actions tab.

on:
  push:
    branches: [ main ]
    paths:
      - config/version.rb
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # Read the SemVer constant; decide whether this release moves :latest.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      latest: ${{ steps.version.outputs.latest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read version from config/version.rb
        id: version
        run: |
          V=$(ruby -e "require './config/version'; puts Kith::VERSION")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # A pre-release (e.g. 0.2.0-dev) publishes its own tag but not :latest.
          if [[ "$V" == *-* ]]; then latest=false; else latest=true; fi
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "Building v$V (move :latest = $latest)"

  build:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Written to VERSION in the image and read at boot by
          # config/initializers/revision.rb, so a running container can say
          # which commit it is.
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          # Publish the version under both spellings. The v-prefix is the
          # convention here, but `image: ghcr.io/dkam/kith:0.1.0-dev` in a
          # compose file is the natural thing to write from the version string,
          # and it fails as "manifest unknown" — which reads like a build that
          # never happened rather than a typo. Both tags point at one manifest,
          # so the extra alias costs nothing.
          V="${{ needs.prepare.outputs.version }}"
          tags="-t ${{ env.IMAGE }}:v$V -t ${{ env.IMAGE }}:$V"
          if [ "${{ needs.prepare.outputs.latest }}" = "true" ]; then
            tags="$tags -t ${{ env.IMAGE }}:latest"
          fi
          docker buildx imagetools create $tags $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect result
        # Inspect what this run actually published. Inspecting :latest would
        # report the *previous* release whenever a pre-release deliberately left
        # that tag alone, and would fail outright on a first-ever build.
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:v${{ needs.prepare.outputs.version }}

  # Tag the commit the image was built from, so `git checkout vX.Y.Z` gets you
  # exactly what is running. Only for real releases: a pre-release publishes an
  # image but does not earn a permanent mark in the history.
  tag:
    needs: [prepare, merge]
    if: needs.prepare.outputs.latest == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create the release tag
        env:
          VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          # Idempotent: re-running the workflow on an unchanged version should
          # be a no-op rather than a failure.
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "$VERSION already tagged — nothing to do."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Kith $VERSION"
          git push origin "$VERSION"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: v${{ needs.prepare.outputs.version }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — nothing to do."
            exit 0
          fi
          gh release create "$VERSION" \
            --title "Kith $VERSION" \
            --generate-notes
